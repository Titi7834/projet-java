name: CI/CD

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  IMAGE: titi3478/webapp
  # 1 = Trivy bloque le pipeline si des vulnérabilités HIGH/CRITICAL sont trouvées (0 = simple rapport)
  TRIVY_EXIT_CODE: "1"

jobs:
  # 1. Compilation, tests et création du WAR (webapp/target/webapp.war)
  build:
    runs-on: [self-hosted, local]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "11"
          cache: maven

      - uses: stCarolas/setup-maven@v5
        with:
          maven-version: 3.9.9

      - name: Build et tests Maven
        run: mvn clean verify

      - name: Conserver les fichiers compilés pour les jobs suivants
        uses: actions/upload-artifact@v4
        with:
          name: target
          path: |
            server/target
            webapp/target
          retention-days: 1

  # 2. Analyse SonarQube (le scanner de SonarQube 13.x demande Java 21)
  sonar:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: [self-hosted, local]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - uses: stCarolas/setup-maven@v5
        with:
          maven-version: 3.9.9

      - uses: actions/download-artifact@v4
        with:
          name: target
          path: .

      - name: Analyse SonarQube
        env:
          SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: mvn verify -DskipTests sonar:sonar -Dsonar.projectKey=webapp

  # 3. Image Docker : build, scan Trivy, puis push sur Docker Hub (uniquement si le scan est passé)
  package:
    needs: sonar
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: [self-hosted, local]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: target
          path: .

      - name: Tag de l'image (identifiant court du commit)
        run: echo "TAG=${GITHUB_SHA::7}" >> "$GITHUB_ENV"

      - name: Build image
        run: docker build -t $IMAGE:$TAG -t $IMAGE:latest .

      - name: Scan Trivy
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v trivy-cache:/root/.cache/ \
            aquasec/trivy:latest image \
            --severity HIGH,CRITICAL \
            --exit-code $TRIVY_EXIT_CODE \
            $IMAGE:$TAG

      - name: Push image sur Docker Hub
        env:
          DOCKERHUB_USER: ${{ secrets.DOCKERHUB_USER }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          echo "$DOCKERHUB_TOKEN" | docker login -u "$DOCKERHUB_USER" --password-stdin
          docker push $IMAGE:$TAG
          docker push $IMAGE:latest

  # 4. Déploiement Docker local (http://localhost:8081) puis mise à jour des manifests pour Argo CD
  deploy:
    needs: package
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: [self-hosted, local]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Tag de l'image (identifiant court du commit)
        run: echo "TAG=${GITHUB_SHA::7}" >> "$GITHUB_ENV"

      - name: Déploiement du conteneur Docker
        run: |
          docker rm -f webapp || true
          docker run -d --name webapp -p 8081:8080 $IMAGE:$TAG

      # Argo CD synchronise ensuite K3s depuis le dossier k8s/.
      # Le push avec GITHUB_TOKEN ne relance pas le workflow (et le message contient [skip ci]).
      - name: Mise à jour des manifests
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin main
          sed -i "s|image: titi3478/webapp:.*|image: ${IMAGE}:${TAG}|" k8s/deployment.yaml
          git add k8s/deployment.yaml
          git commit -m "k8s: webapp image ${TAG} [skip ci]" || echo "Rien à committer"
          git push origin HEAD:main

  # 5. Nettoyage des images Docker inutilisées, même si le pipeline a échoué
  cleanup:
    needs: [build, sonar, package, deploy]
    if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: [self-hosted, local]
    steps:
      - name: Nettoyage des images orphelines
        run: docker image prune -f || true