pipeline {
    agent any

    options {
        gitLabConnection('Titi34')
        disableConcurrentBuilds()
    }

    triggers {
        // Vérification périodique du dépôt toutes les ~2 minutes (build uniquement s'il y a un nouveau commit)
        pollSCM('H/2 * * * *')

        // Déclencheurs GitLab (nécessite un webhook joignable depuis gitlab.com)
        gitlab(
            triggerOnPush: true,
            triggerToBranchDeleteRequest: false,
            triggerOnMergeRequest: true,
            triggerOnlyIfNewCommitsPushed: false,
            triggerOnAcceptedMergeRequest: false,
            triggerOnClosedMergeRequest: false,
            triggerOpenMergeRequestOnPush: 'never',
            triggerOnApprovedMergeRequest: true,
            triggerOnNoteRequest: true,
            noteRegex: 'Jenkins please retry a build',
            ciSkip: true,
            skipWorkInProgressMergeRequest: true,
            setBuildDescription: true,
            branchFilterType: 'All'
        )
    }

    tools {
        maven 'Maven-Atelier'
        jdk 'JDK Atelier'
    }

    environment {
        IMAGE = 'titi3478/webapp'
        TAG   = "${env.BUILD_NUMBER}"
        // 1 = Trivy bloque le pipeline si des vulnérabilités HIGH/CRITICAL sont trouvées (0 = simple rapport)
        TRIVY_EXIT_CODE = '1'
    }

    stages {

        stage('Checkout') {
            steps {
                checkout scm
            }
        }

        // Ignoré si le dernier commit vient de Jenkins (mise à jour du tag dans k8s/) : évite une boucle infinie
        stage('CI/CD') {
            when {
                not {
                    expression {
                        return sh(script: 'git log -1 --pretty=%B', returnStdout: true).contains('[skip ci]')
                    }
                }
            }
            stages {

                // Un seul build Maven (compilation, tests, WAR) + une seule analyse SonarQube
                stage('Build et analyse SonarQube') {
                    steps {
                        withSonarQubeEnv('SonarQube') {
                            sh 'mvn clean verify sonar:sonar -Dsonar.projectKey=webapp'
                        }
                    }
                }

                stage('Build image') {
                    steps {
                        sh 'docker build -t $IMAGE:$TAG -t $IMAGE:latest .'
                    }
                }

                // Analyse de l'image avec Trivy avant de la publier
                stage('Scan Trivy') {
                    steps {
                        sh '''
                            docker run --rm \
                                -v /var/run/docker.sock:/var/run/docker.sock \
                                -v trivy-cache:/root/.cache/ \
                                aquasec/trivy:latest image \
                                --severity HIGH,CRITICAL \
                                --exit-code $TRIVY_EXIT_CODE \
                                $IMAGE:$TAG
                        '''
                    }
                }

                stage('Push image') {
                    steps {
                        withCredentials([usernamePassword(credentialsId: 'dockerhub-credentials',
                                usernameVariable: 'DH_USER', passwordVariable: 'DH_PASS')]) {
                            sh '''
                                echo "$DH_PASS" | docker login -u "$DH_USER" --password-stdin
                                docker push $IMAGE:$TAG
                                docker push $IMAGE:latest
                            '''
                        }
                    }
                }
                stage('Deploy') {
                    steps {
                        sh '''
                            docker rm -f webapp || true
                            docker run -d --name webapp -p 8081:8080 $IMAGE:$TAG
                        '''
                    }
                }

                // Argo CD synchronise ensuite K3s depuis le dossier k8s/
                stage('Mise à jour des manifests') {
                    steps {
                        sh '''
                            sed -i "s|image: titi3478/webapp:.*|image: ${IMAGE}:${TAG}|" k8s/deployment.yaml
                            git config user.email "jenkins@local"
                            git config user.name "Jenkins"
                            git add k8s/deployment.yaml
                            git commit -m "k8s: webapp image ${TAG} [skip ci]" || echo "Rien à committer"
                        '''
                        withCredentials([usernamePassword(credentialsId: 'gitlab-push',
                                usernameVariable: 'GL_USER', passwordVariable: 'GL_PASS')]) {
                            sh 'git push https://${GL_USER}:${GL_PASS}@gitlab.com/Titi34/projet-java.git HEAD:main'
                        }
                    }
                }
            }
        }
    }

    post {
        always {
            sh 'docker image prune -f || true'
        }
    }
}