pipeline {
    agent any

    options {
        // Connexion GitLab configurée dans Manage Jenkins > System (nom : Titi34)
        gitLabConnection('Titi34')
    }

    triggers {
        // "Construire après le build sur d'autres projets" (même si instable)
        upstream(upstreamProjects: 'TestSonar', threshold: hudson.model.Result.UNSTABLE)
        // "Construire lorsqu'un changement est poussé vers GitLab"
        gitlab(
            triggerOnPush: true,
            triggerToBranchDeleteRequest: false,
            triggerOnMergeRequest: true,
            triggerOnlyIfNewCommitsPushed: false,
            triggerOnAcceptedMergeRequest: false,
            triggerOnClosedMergeRequest: false,
            triggerOpenMergeRequestOnPush: 'never',
            triggerOnApprovedMergeRequest: true,
            triggerOnNoteRequest: true,
            noteRegex: 'Jenkins please retry a build'
        )
    }

    tools {
        maven 'Maven-Atelier'
        jdk 'JDK Atelier'
    }

    environment {
        IMAGE = 'titi3478/webapp'
        TAG   = "${env.BUILD_NUMBER}"
    }

    stages {
        stage('Checkout') {
            steps {
                git branch: 'main',
                    url: 'https://gitlab.com/Titi34/projet-java.git'
            }
        }

        stage('Build WAR') {
            steps {
                sh 'mvn clean package'
            }
        }

        stage('Analyse SonarQube') {
            steps {
                withSonarQubeEnv('SonarQube') {
                    sh 'mvn sonar:sonar -Dsonar.projectKey=webapp'
                }
            }
        }

        stage('Build image') {
            steps {
                sh 'docker build -t $IMAGE:$TAG -t $IMAGE:latest .'
            }
        }

        stage('Push image') {
            steps {
                withCredentials([usernamePassword(credentialsId: 'dockerhub-credentials',
                        usernameVariable: 'DH_USER', passwordVariable: 'DH_PASS')]) {
                    sh '''
                        echo "$DH_PASS" | docker login -u "$DH_USER" --password-stdin
                        docker push $IMAGE:$TAG
                        docker push $IMAGE:latest
                    '''
                }
            }
        }

        stage('Deploy') {
            steps {
                sh '''
                    docker rm -f webapp || true
                    docker run -d --name webapp -p 8081:8080 $IMAGE:$TAG
                    docker image prune -f
                '''
            }
        }
    }
}